name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main from test through deploy, including updates of the latest tag.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: bash -n deploy/deploy.sh deploy/compose.sh test/deploy.test.sh
      - name: Validate workflow expressions and shell
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci-cd.yml
      - name: Validate production Compose with dummy configuration
        env:
          IMAGE_VERSION: :sha-${{ github.sha }}
          HELPDESK_DATA_VOLUME: ci-unused-volume
          HELPDESK_ENV_FILE: /dev/null
        run: docker compose -f compose.prod.yaml config --quiet
      - run: docker build --target test -t helpdesk-ci-test .
      - name: Test deployment failure detection in isolation
        run: docker run --rm -v "$PWD:/repo:ro" helpdesk-ci-test bash /repo/test/deploy.test.sh
      - run: docker build --target runtime .

  publish:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: runtime
          push: true
          tags: |
            marcelobarbusa/helpdesk-ti-discord:latest
            marcelobarbusa/helpdesk-ti-discord:sha-${{ github.sha }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_AWS_DEPLOY == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: helpdesk-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Transfer release and deploy exact digest
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          release="/opt/helpdesk/releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$ssh_dir/release.tgz" compose.prod.yaml -C deploy deploy.sh compose.sh
          # Values are validated above or generated by GitHub; expand locally intentionally.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "umask 077; mkdir -p '$release'"
          scp "${ssh_opts[@]}" "$ssh_dir/release.tgz" "$EC2_USER@$EC2_HOST:$release/release.tgz"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" \
            "set -eu; cd '$release'; tar -xzf release.tgz; timeout 600 bash ./deploy.sh '$IMAGE_DIGEST'"
