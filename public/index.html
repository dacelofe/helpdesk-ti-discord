<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HelpDesk TI</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <i class="bi bi-headset"></i>

            <span>HelpDesk TI</span>

        </div>

        <div class="status-discord">

            <span class="status online"></span>

            Discord Conectado

        </div>

    </header>

    <!-- CONTAINER -->

    <main class="container">

        <section class="hero">

            <h1>Sistema de Chamados</h1>

            <p>
                Aplicação desenvolvida para integração com o Discord.
            </p>

        </section>

        <!-- STATUS -->

        <section class="cards">

            <div class="card">

                <i class="bi bi-hdd-network"></i>

                <h3>Backend</h3>

                <p id="backendStatus">
                    Online
                </p>

            </div>

            <div class="card">

                <i class="bi bi-discord"></i>

                <h3>Discord</h3>

                <p id="discordStatus">

                    Conectado

                </p>

            </div>

            <div class="card">

                <i class="bi bi-robot"></i>

                <h3>Bot</h3>

                <p>

                    HelpDeskBOT

                </p>

            </div>

            <div class="card">

                <i class="bi bi-hash"></i>

                <h3>Canal</h3>

                <p>

                    #suporte

                </p>

            </div>

        </section>

        <!-- AÇÕES -->

        <section class="actions">

            <a href="novo-chamado.html" class="btn-primary">

                <i class="bi bi-plus-circle"></i>

                Abrir Novo Chamado

            </a>

        </section>

        <!-- ÚLTIMA MENSAGEM -->

        <section class="card mensagem">

            <h2>

                Último Chamado

            </h2>

            <p id="ultimaMensagem">

                Nenhum chamado enviado.

            </p>

        </section>

    </main>

    <footer>

        © 2026 - HelpDesk TI | Projeto de Integração Discord

    </footer>

    <script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>

</html>
